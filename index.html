<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conference Kids</title>
<meta name="description" content="Bingo, notes and points for kids watching General Conference.">
<meta name="theme-color" content="#5b7cfa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conf Kids">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6ff; --card:#ffffff; --ink:#1f2544; --muted:#6b7194; --line:#e3e7fb;
  --brand:#5b7cfa; --brand-ink:#ffffff; --gold:#ffc83d; --danger:#ef5b5b; --ok:#2fbf71;
  --c1:#ff8a65; --c2:#4fc3f7; --c3:#ba68c8; --c4:#66bb6a;
  --radius:22px; --shadow:0 4px 0 rgba(31,37,68,.08), 0 10px 24px rgba(31,37,68,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;}
body{min-height:100dvh;-webkit-user-select:none;user-select:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{max-width:980px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:var(--bg)}
.top h1{flex:1;margin:0;font-size:clamp(20px,4vw,28px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:48px;height:48px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:28px;line-height:1;display:grid;place-items:center;flex:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 14px 6px 8px;font-size:20px;font-weight:600;flex:none;border:3px solid var(--kc)}
.chip .e{font-size:24px}

/* home */
.hero{text-align:center;padding:calc(28px + env(safe-area-inset-top)) 0 12px}
.hero .logo{font-size:64px;line-height:1}
.hero h1{margin:6px 0 0;font-size:clamp(32px,7vw,48px);font-weight:700;color:var(--brand)}
.hero p{margin:4px 0 0;font-size:22px;color:var(--muted)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin:20px 0}
.kid-tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:4px solid var(--kc,transparent);transition:transform .12s}
.kid-tile:active{transform:scale(.96)}
.kid-tile .av{font-size:64px;line-height:1.1}
.kid-tile .nm{font-size:22px;font-weight:600}
.kid-tile .pt{font-size:18px;color:var(--muted)}
.kid-tile.add{border:4px dashed var(--line);box-shadow:none;background:transparent;color:var(--muted)}
.parent-link{display:block;margin:24px auto 0;padding:12px 20px;border-radius:999px;color:var(--muted);font-size:18px}

/* generic */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:20px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn.danger{background:var(--danger)}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:40px;padding:0 14px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.inp{width:100%;font-size:22px;padding:14px 16px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);outline:none}
.inp:focus{border-color:var(--brand)}
.label{font-size:16px;color:var(--muted);margin:16px 0 8px;font-weight:500}
.muted{color:var(--muted)}
.err{color:var(--danger);min-height:1.2em;margin:8px 0 0}
h2{margin:0 0 8px;font-size:26px}
h3{margin:22px 0 10px;font-size:22px}

/* kid dashboard */
.big-points{display:flex;align-items:center;gap:18px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;border:4px solid var(--kc)}
.big-points .av{font-size:72px;line-height:1}
.big-points .num{font-size:clamp(40px,9vw,60px);font-weight:700;line-height:1}
.big-points .lbl{font-size:18px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:18px}
.menu-btn{border-radius:var(--radius);padding:26px 16px;color:#fff;font-size:30px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.15);transition:transform .1s}
.menu-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.menu-btn span{font-size:64px;line-height:1}
.menu-btn small{font-size:16px;font-weight:500;opacity:.9}
.hint{margin-top:18px;text-align:center;font-size:19px;color:var(--muted)}

/* boards list */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.board-pick{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:center;text-align:left;transition:transform .1s}
.board-pick:active{transform:scale(.97)}
.board-pick .ic{font-size:48px;line-height:1}
.board-pick b{display:block;font-size:22px}
.board-pick .muted{font-size:16px}
.board-pick .st{display:inline-block;margin-top:6px;font-size:15px;padding:3px 10px;border-radius:999px;background:#eef1ff;color:var(--brand);font-weight:600}

/* bingo */
.bingo-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.bingo-head .tip{flex:1;font-size:17px;color:var(--muted);min-width:200px}
.stat{background:var(--card);border-radius:999px;padding:8px 14px;font-size:17px;font-weight:600;box-shadow:var(--shadow)}
.board-wrap{display:flex;justify-content:center}
.board{width:min(100%, calc(100dvh - 210px));min-width:min(100%,320px);aspect-ratio:1;display:grid;gap:1.2%;container-type:inline-size}
.cell{position:relative;background:var(--card);border-radius:12px;box-shadow:0 3px 0 rgba(31,37,68,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4%;text-align:center;overflow:hidden;border:3px solid transparent;transition:transform .12s, background .2s}
.cell:active{transform:scale(.94)}
.cell .e{font-size:6.2cqi;line-height:1.1}
.cell .t{font-size:2.9cqi;line-height:1.1;font-weight:500;margin-top:2%;word-break:break-word;hyphens:auto}
.board.s4 .cell .e{font-size:10cqi}
.board.s4 .cell .t{font-size:3.8cqi}
.board.big .cell .e{font-size:12cqi}
.cell .stamp{position:absolute;inset:0;display:grid;place-items:center;font-size:12cqi;opacity:0;transform:scale(1.6) rotate(-15deg);transition:opacity .15s, transform .2s;pointer-events:none}
.board.s4 .cell .stamp{font-size:15cqi}
.cell.on{background:color-mix(in srgb, var(--kc) 30%, white)}
.cell.on .stamp{opacity:.32;transform:scale(1) rotate(-12deg)}
.cell.on .t{font-weight:600;position:relative;z-index:1}
.cell.free{background:linear-gradient(135deg,#fff3c4,#ffe08a)}
.cell.free .stamp{opacity:.35;transform:none}
.cell.win{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,61,.45), 0 3px 0 rgba(31,37,68,.08)}
.bingo-foot{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}

/* notes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip-btn{padding:10px 16px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:17px;font-weight:500}
.chip-btn.sel{background:var(--brand);color:#fff}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.note{background:#fffbe6;border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:140px;transition:transform .1s}
.note:active{transform:scale(.97)}
.note .when{font-size:14px;color:var(--muted);font-weight:600}
.note .txt{font-size:18px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.note img{width:100%;max-height:160px;object-fit:contain;border-radius:10px;background:#fff}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:20px}
.empty span{font-size:56px;display:block}
textarea.notepad{width:100%;min-height:42dvh;font-size:22px;line-height:1.5;padding:16px;border-radius:18px;border:3px solid var(--line);background:#fffbe6 repeating-linear-gradient(transparent 0 32px,#f0e6bf 32px 33px);background-attachment:local;outline:none;resize:vertical;color:var(--ink)}
textarea.notepad:focus{border-color:var(--gold)}
.prompt{padding:9px 14px;border-radius:12px;background:#fff3c4;font-size:16px;font-weight:500}
.thumb{margin-top:12px;display:flex;gap:12px;align-items:center}
.thumb img{width:160px;border-radius:12px;box-shadow:var(--shadow);background:#fff}

/* draw */
.canvas-wrap{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
canvas#cv{display:block;width:100%;touch-action:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.swatch{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.sel{box-shadow:0 0 0 4px var(--ink)}
.size{width:44px;height:44px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.size.sel{outline:3px solid var(--ink)}
.size i{display:block;background:var(--ink);border-radius:50%}

/* rewards */
.rewards{display:grid;gap:14px}
.reward{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.reward .nm{font-size:22px;font-weight:600}
.reward .info{flex:1;min-width:180px}
.bar{height:14px;border-radius:999px;background:#eef1ff;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f43);border-radius:999px}

/* parent */
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}
.prow:last-child{border-bottom:0}
.prow .av{font-size:36px}
.prow .nm{font-size:20px;font-weight:600;flex:1;min-width:100px}
.prow .pts{font-size:20px;font-weight:700;min-width:70px;text-align:right}
.hist{font-size:15px;color:var(--muted);max-height:260px;overflow:auto}
.hist div{padding:4px 0;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* emoji + color pickers */
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick button{width:58px;height:58px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:34px}
.pick button.sel{outline:4px solid var(--brand)}
.pick .col{border-radius:50%;width:48px;height:48px}

/* modal + overlay */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,24,50,.45);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:var(--card);border-radius:26px;padding:24px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .2s ease-out}
#modal .box p{font-size:19px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#celebrate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.7);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#celebrate.show{display:flex}
#celebrate .big{font-size:clamp(64px,16vw,140px);font-weight:700;color:var(--brand);text-shadow:0 6px 0 var(--gold);animation:bounce .6s ease-out}
#celebrate .sub{font-size:clamp(26px,5vw,40px);font-weight:600;margin-top:6px}
#celebrate .tap{font-size:18px;color:var(--muted);margin-top:22px}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
#confetti{position:fixed;inset:0;z-index:31;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:18px;z-index:40;transition:transform .25s}
#offline{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff3c4;color:var(--ink);padding:8px 16px;border-radius:999px;font-size:15px;z-index:40;box-shadow:var(--shadow);display:none}
#offline.show{display:block}
#toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:520px){
  .cell{border-radius:8px;border-width:2px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="celebrate" data-act="closeCelebrate"><div class="big" id="celBig">BINGO!</div><div class="sub" id="celSub"></div><div class="tap">Tap to keep playing</div></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<div id="offline">📡 Offline. Changes will sync when you’re back online.</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, push, increment } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* ============ Bingo square pools ============ */
const WORDS = [
  {t:"Jesus Christ",e:"🌟"},{t:"Heavenly Father",e:"☀️"},{t:"Holy Ghost",e:"🕊️"},{t:"Faith",e:"🌱"},
  {t:"Prayer",e:"🙏"},{t:"Temple",e:"🏛️"},{t:"Covenant",e:"🤝"},{t:"Repent",e:"🔄"},
  {t:"Book of Mormon",e:"📘"},{t:"Scriptures",e:"📖"},{t:"Prophet",e:"🗣️"},{t:"Testimony",e:"💬"},
  {t:"Baptism",e:"💧"},{t:"Sabbath",e:"📅"},{t:"Family",e:"👨‍👩‍👧‍👦"},{t:"Love",e:"❤️"},
  {t:"Joy",e:"😊"},{t:"Peace",e:"😌"},{t:"Light",e:"💡"},{t:"Hope",e:"⭐"},
  {t:"Grace",e:"🎁"},{t:"Service",e:"🫶"},{t:"Missionary",e:"🧳"},{t:"Ministering",e:"🤗"},
  {t:"Eternal",e:"♾️"},{t:"Savior",e:"💛"},{t:"Atonement",e:"🌿"},{t:"Restoration",e:"🌄"},
  {t:"Joseph Smith",e:"🌳"},{t:"Obedience",e:"✅"},{t:"Miracle",e:"✨"},{t:"Disciple",e:"👣"},
  {t:"Gathering",e:"🧺"},{t:"Agency",e:"🛤️"},{t:"“Brothers and sisters”",e:"👫"},{t:"Children",e:"🧒"},
  {t:"Commandments",e:"📜"},{t:"Grateful",e:"🙌"},{t:"Kindness",e:"🌻"},{t:"Priesthood",e:"🗝️"},
  {t:"Heaven",e:"☁️"},{t:"Pioneers",e:"🛞"},{t:"Sacrament",e:"🍞"},{t:"Forgive",e:"💞"},
  {t:"Blessings",e:"🎉"},{t:"Humble",e:"🌾"}
];
const LOOK = [
  {t:"Choir sings",e:"🎶"},{t:"Speaker wears glasses",e:"👓"},{t:"Red tie",e:"👔"},{t:"Blue tie",e:"👔"},
  {t:"Striped tie",e:"👔"},{t:"Gray or white hair",e:"👴"},{t:"A woman speaks",e:"👩"},{t:"Flowers on screen",e:"💐"},
  {t:"The organ",e:"🎹"},{t:"A temple on screen",e:"🏛️"},{t:"Conference Center",e:"🏟️"},{t:"Audience laughs",e:"😂"},
  {t:"Speaker wipes a tear",e:"🥲"},{t:"Speaker holds scriptures",e:"📖"},{t:"Everyone stands (rest hymn)",e:"🧍"},{t:"Raise hand to sustain",e:"✋"},
  {t:"Big smile",e:"😁"},{t:"Someone sips water",e:"🥤"},{t:"Speaker turns a page",e:"📄"},{t:"Mountains on screen",e:"🏔️"},
  {t:"Flowered dress",e:"👗"},{t:"Choir in matching colors",e:"🌈"},{t:"Conductor waves arms",e:"🎼"},{t:"Someone yawns (maybe you!)",e:"🥱"},
  {t:"Speaker points",e:"👉"},{t:"A pin or necklace",e:"📿"},{t:"Pulpit moves up or down",e:"↕️"},{t:"Close-up of someone in audience",e:"🎥"},
  {t:"Purple tie",e:"👔"},{t:"Someone with a beard",e:"🧔"},{t:"Speaker taps the pulpit",e:"👆"},{t:"Yellow tie",e:"👔"}
];
const STORIES = [
  {t:"A joke is told",e:"🤣"},{t:"Story from when speaker was a kid",e:"🧒"},{t:"Story about a grandchild",e:"👶"},{t:"Mission story",e:"🧳"},
  {t:"Mentions an animal",e:"🐶"},{t:"Mentions food",e:"🍕"},{t:"Mentions a sport",e:"⚽"},{t:"Car or driving",e:"🚗"},
  {t:"Weather or a storm",e:"⛈️"},{t:"Story from another country",e:"🌍"},{t:"Speaks another language",e:"🗣️"},{t:"Quotes a hymn",e:"🎵"},
  {t:"Reads a scripture",e:"📖"},{t:"Names a temple",e:"🏛️"},{t:"Talks about a mom",e:"👩‍👧"},{t:"Talks about a dad",e:"👨‍👦"},
  {t:"Phone or technology",e:"📱"},{t:"Pioneer story",e:"🛞"},{t:"Bible story",e:"📜"},{t:"Book of Mormon story",e:"📘"},
  {t:"Bears testimony",e:"💬"},{t:"Says a year (like 1830)",e:"🔢"},{t:"A hard time",e:"🌧️"},{t:"Talks about a friend",e:"🤝"},
  {t:"House or home",e:"🏠"},{t:"Ocean or boat",e:"🌊"},{t:"Tree or garden",e:"🌳"},{t:"Gives us a challenge",e:"🎯"},
  {t:"Mountain story",e:"⛰️"},{t:"Talks about school",e:"🏫"},{t:"Talks about a job or work",e:"💼"},{t:"Mentions a doctor or hospital",e:"🏥"},
  {t:"Talks about Jesus' life",e:"🌟"},{t:"Mentions a wedding",e:"💍"}
];
const LITTLE = [
  {t:"Prayer",e:"🙏"},{t:"Singing",e:"🎶"},{t:"Glasses",e:"👓"},{t:"Tie",e:"👔"},
  {t:"Laughing",e:"😂"},{t:"Scriptures",e:"📖"},{t:"Temple",e:"🏛️"},{t:"Love",e:"❤️"},
  {t:"A lady talks",e:"👩"},{t:"Gray hair",e:"👴"},{t:"Flowers",e:"🌸"},{t:"Raise hand",e:"✋"},
  {t:"Stand up",e:"🧍"},{t:"Animal",e:"🐶"},{t:"Baby",e:"👶"},{t:"Jesus",e:"🌟"},
  {t:"Home",e:"🏠"},{t:"Water",e:"💧"},{t:"Family",e:"👨‍👩‍👧"},{t:"Mountains",e:"🏔️"},{t:"Smile",e:"😁"}
];
const MIXED = (()=>{const seen=new Set();return [...WORDS,...LOOK,...STORIES].filter(x=>!seen.has(x.t)&&seen.add(x.t));})();

const BOARDS = [
  {id:'words',  name:'Word Hunt',        icon:'👂', desc:'Listen for these words',      size:5, free:true,  pool:WORDS},
  {id:'look',   name:'Look & See',       icon:'👀', desc:'Watch for these things',      size:5, free:true,  pool:LOOK},
  {id:'stories',name:'Stories & Moments',icon:'📚', desc:'Things speakers talk about',  size:5, free:true,  pool:STORIES},
  {id:'little', name:'Little Kids',      icon:'🧸', desc:'Big pictures, smaller board', size:4, free:false, pool:LITTLE, big:true},
  {id:'mixed',  name:'Mix-It-Up',        icon:'🎲', desc:'A little of everything',      size:5, free:true,  pool:MIXED},
];
const FREE = {t:"FREE",e:"⭐",free:true};

const SESSIONS = [
  {id:'sat-am', name:'Sat Morning'},{id:'sat-pm', name:'Sat Afternoon'},{id:'sat-eve', name:'Sat Evening'},
  {id:'sun-am', name:'Sun Morning'},{id:'sun-pm', name:'Sun Afternoon'}
];

function fromDB(f){
  const list = o => Object.entries(o || {}).map(([id, v]) => ({...v, id}));
  S.parentCode = f.parentCode || null;
  S.settings = {...DEFAULT_SETTINGS, ...(f.settings || {})};
  S.kids = list(f.kids).map(k => ({...k, points: k.points || 0})).sort((a,b) => (a.created||0) - (b.created||0));
  S.rewards = list(f.rewards);
  S.cards = f.cards || {};
  S.notes = {};
  for(const [kidId, o] of Object.entries(f.notes || {})) S.notes[kidId] = list(o).map(n => ({text:'', drawing:null, ...n}));
  S.history = list(f.history).sort((a,b) => b.ts - a.ts);
}

let unsubscribe = null;
function connect(){
  if(unsubscribe) unsubscribe();
  unsubscribe = onValue(famRef(), snap => {
    if(!snap.exists()){ V.view = 'notFound'; render(true); return; }
    fromDB(snap.val());
    if(V.view === 'loading') V.view = (device.activeKid && kid()) ? 'kid' : 'home';
    softRender();
  }, err => { console.error(err); V.view = 'notFound'; render(true); });
}

function familyLink(){ return `${location.origin}${location.pathname}?f=${FID}`; }

function newFamilyId(){
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', r = crypto.getRandomValues(new Uint8Array(22));
  return [...r].map(x => a[x % a.length]).join('');
}
async function createFamily(codeHash){
  FID = newFamilyId();
  const rewards = {};
  DEFAULT_REWARDS.forEach(([name, cost]) => rewards[uid()] = {name, cost});
  await set(famRef(), {created:Date.now(), parentCode:codeHash, settings:DEFAULT_SETTINGS, rewards});
  device = {fid: FID}; saveDevice();
  history.replaceState(null, '', familyLink());
  connect();
}

}
function guessSession(){
  const d = new Date(), day = d.getDay(), h = d.getHours();
  if(day === 0) return h < 13 ? 'sun-am' : 'sun-pm';
  if(day === 6) return h < 13 ? 'sat-am' : (h < 17 ? 'sat-pm' : 'sat-eve');
  return 'sat-am';
}

/* ============ Bingo logic ============ */
function newCard(board){
  const n = board.size, total = n*n, mid = board.free ? Math.floor(total/2) : -1;
  const picks = shuffle(board.pool).slice(0, board.free ? total-1 : total);
  const items = [];
  for(let i=0, p=0; i<total; i++) items.push(i === mid ? FREE : picks[p++]);
  return {items, marked: items.map(x => !!x.free), earned:0, lines:0, black:false, created:Date.now()};
}
function getCard(kidId, boardId){
  S.cards[kidId] = S.cards[kidId] || {};
  if(!S.cards[kidId][boardId]){ S.cards[kidId][boardId] = newCard(boardById(boardId)); put(`cards/${kidId}/${boardId}`, S.cards[kidId][boardId]); }
  return S.cards[kidId][boardId];
}
function lineSets(n){
  const L = [];
  for(let r=0;r<n;r++) L.push([...Array(n)].map((_,c)=>r*n+c));
  for(let c=0;c<n;c++) L.push([...Array(n)].map((_,r)=>r*n+c));
  L.push([...Array(n)].map((_,i)=>i*n+i));
  L.push([...Array(n)].map((_,i)=>i*n+(n-1-i)));
  return L;
}
function scoreCard(card, n){
  const done = lineSets(n).filter(l => l.every(i => card.marked[i]));
  const black = card.marked.every(Boolean);
  const win = new Set(done.flat());
  return {lines: done.length, black, win, pts: done.length*S.settings.linePts + (black ? S.settings.blackoutPts : 0)};
}

function scoreboard(){
  return `<div class="card" style="max-width:520px;margin:0 auto">${[...S.kids].sort((a,b) => b.points-a.points).map(k =>
    `<div class="prow"><span class="av">${k.emoji}</span><span class="nm">${esc(k.name)}</span><span class="pts">${k.points}⭐</span></div>`).join('')}</div>`;
}
function statText(card){ return `${card.lines} bingo${card.lines===1?'':'s'} · +${card.earned}⭐`; }
function findNote(id){ const k = kid(); return k && (S.notes[k.id]||[]).find(n => n.id === id); }

/* ============ Render ============ */
const KID_VIEWS = ['kid','boards','bingo','notes','noteEdit','draw','rewards'];
function render(scrollTop){
  if(KID_VIEWS.includes(V.view) && !kid()) V.view = FID ? 'home' : 'welcome';
  document.getElementById('app').innerHTML = (VIEWS[V.view] || VIEWS.home)();
  if(V.view === 'draw') initCanvas();
  if(scrollTop) window.scrollTo(0,0);
}
// Called when data arrives from another device. Avoid wiping out typing, drawing or an open dialog.
let pendingRender = false;
function softRender(){
  const k = kid();
  document.querySelectorAll('.ptsLive').forEach(x => x.textContent = k ? k.points : '');
  const a = document.activeElement, typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
  const busy = typing || ['noteEdit','draw','editKid'].includes(V.view) || document.getElementById('modal').classList.contains('show');
  if(busy){ pendingRender = true; return; }
  pendingRender = false; render();
}
function go(view, extra){ Object.assign(V, extra||{}, {view}); pendingRender = false; render(true); }

/* ============ Modal / toast / celebrate ============ */
function showModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); V.modalCb = null; if(pendingRender) softRender(); }
function confirmBox(title, msg, yes, cb, danger){
  V.modalCb = cb;
  showModal(`<h2>${title}</h2><p>${msg}</p><div class="row end"><button class="btn ghost" data-act="closeModal">Cancel</button>
    <button class="btn ${danger?'danger':''}" data-act="modalYes">${yes}</button></div>`);
}
// Not real security (anyone with the family link and dev tools could change it); it keeps the code out of plain sight.
function hashCode(str){
  let h = 0x811c9dc5;
  for(const ch of 'conference-kids:' + str){ h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}
function gate(cb){
  if(!S.parentCode) return cb();
  V.gateCb = cb;
  showModal(`<h2>🔒 Grown-ups only</h2><p>Enter the parent code.</p>
    <input id="gateIn" class="inp" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="err" id="gateErr"></p>
    <div class="row end"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="gateCheck">OK</button></div>`);
  setTimeout(() => { const i = document.getElementById('gateIn'); i && i.focus(); }, 60);
}
function setCode(cb){
  V.setCodeCb = cb;
  showModal(`<h2>🔒 ${S.parentCode ? 'Change' : 'Create'} parent code</h2>
    <p>Pick a code or password the kids don’t know (at least 4 characters). It works on every device in your family.</p>
    <div class="label">New code</div><input id="codeA" class="inp" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <div class="label">Type it again</div><input id="codeB" class="inp" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <p class="err" id="codeErr"></p>
    <div class="row end"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="saveCode">Save code</button></div>`);
  setTimeout(() => { const i = document.getElementById('codeA'); i && i.focus(); }, 60);
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

function celebrate(big, sub){
  document.getElementById('celBig').textContent = big;
  document.getElementById('celSub').textContent = sub;
  document.getElementById('celebrate').classList.add('show');
  confetti(); chime();
}
function confetti(){
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ff6b6b','#ffc83d','#51cf66','#339af0','#cc5de8','#ff9f43'];
  const P = [...Array(160)].map(() => ({x:Math.random()*c.width, y:-20-Math.random()*c.height*.5, r:5+Math.random()*7,
    vx:(Math.random()-.5)*4, vy:2+Math.random()*4, a:Math.random()*6, va:(Math.random()-.5)*.3, col:cols[rand(0,cols.length-1)]}));
  const start = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.col; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(t - start < 3200) requestAnimationFrame(frame); else ctx.clearRect(0,0,c.width,c.height);
  })(start);
}
let audioCtx;
function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [523.25,659.25,783.99,1046.5].forEach((f,i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + i*.11;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.18, t0+.02); g.gain.exponentialRampToValueAtTime(.001, t0+.5);
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0+.55);
    });
  }catch(e){}
}

/* ============ Drawing ============ */
// Strokes are kept as a list (not canvas snapshots) so undo/redo stays light on tablet memory.
// A {clear:true} entry wipes everything before it, including the saved drawing, and can be undone too.
function initCanvas(){
  const n = findNote(V.noteId); if(!n) return;
  const c = document.getElementById('cv'), wrap = c.parentElement;
  const w = wrap.clientWidth, h = Math.max(260, Math.min(Math.round(w*.75), innerHeight - 230));
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); c.style.height = h+'px';
  const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  V.canvas = {ctx, w, h, base:null, strokes:[], redo:[]};
  redrawCanvas();
  if(n.drawing){ const img = new Image(); img.onload = () => { V.canvas.base = img; redrawCanvas(); }; img.src = n.drawing; }
  let cur = null;
  const pos = e => { const r = c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  c.onpointerdown = e => {
    c.setPointerCapture(e.pointerId); e.preventDefault();
    const p = pos(e);
    cur = {color:V.pen.color, width:V.pen.color==='#ffffff' ? V.pen.size*3 : V.pen.size, pts:[p, {x:p.x+.1, y:p.y+.1}]};
    V.canvas.strokes.push(cur); V.canvas.redo = [];
    drawSegment(cur, 0); updateUndoButtons();
  };
  c.onpointermove = e => { if(!cur) return; cur.pts.push(pos(e)); drawSegment(cur, cur.pts.length - 2); };
  c.onpointerup = c.onpointercancel = () => { cur = null; };
}
function drawSegment(st, i){
  const ctx = V.canvas.ctx, a = st.pts[i], b = st.pts[i+1];
  ctx.strokeStyle = st.color; ctx.lineWidth = st.width;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
}
function redrawCanvas(){
  const {ctx, w, h, base, strokes} = V.canvas;
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
  let from = 0;
  for(let i = strokes.length - 1; i >= 0; i--) if(strokes[i].clear){ from = i + 1; break; }
  if(from === 0 && base) ctx.drawImage(base,0,0,w,h);
  for(let i = from; i < strokes.length; i++){
    const st = strokes[i];
    ctx.strokeStyle = st.color; ctx.lineWidth = st.width; ctx.beginPath(); ctx.moveTo(st.pts[0].x, st.pts[0].y);
    for(let j = 1; j < st.pts.length; j++) ctx.lineTo(st.pts[j].x, st.pts[j].y);
    ctx.stroke();
  }
}
function updateUndoButtons(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if(u) u.disabled = !V.canvas.strokes.length;
  if(r) r.disabled = !V.canvas.redo.length;
}

/* ============ Actions ============ */
const notePath = (n, field) => `notes/${S.activeKid}/${n.id}${field ? '/' + field : ''}`;
let textT;
const A = {
  go: d => go(d.to),
  createFamilyStart(){ setCode(() => { go('parent'); toast('Family created! Now add your kids.'); }); },
  forgetFamily(){ device = {}; saveDevice(); FID = null; if(unsubscribe) unsubscribe(); history.replaceState(null, '', location.pathname); go('welcome'); },

  newKid(){ V.draft = {name:'', emoji:AVATARS[rand(0,AVATARS.length-1)], color:COLORS[S.kids.length % COLORS.length]}; go('editKid'); },
  editKid(d){ const k = S.kids.find(x => x.id===d.id); V.draft = {...k}; go('editKid'); },
  draftEmoji(d){ V.draft.emoji = d.v; render(); },
  draftColor(d){ V.draft.color = d.v; render(); },
  saveKid(){
    const d = V.draft, name = (d.name||'').trim();
    if(!name){ document.getElementById('kidErr').textContent = 'Please type a name.'; return; }
    if(d.id){
      Object.assign(S.kids.find(x => x.id===d.id), {name, emoji:d.emoji, color:d.color});
      patch({[`kids/${d.id}/name`]:name, [`kids/${d.id}/emoji`]:d.emoji, [`kids/${d.id}/color`]:d.color});
    } else {
      const k = {id:uid(), name, emoji:d.emoji, color:d.color, points:0, created:Date.now()};
      S.kids.push(k); put(`kids/${k.id}`, {name, emoji:k.emoji, color:k.color, points:0, created:k.created});
    }
    go('parent');
  },
  pickKid(d){ S.activeKid = d.id; go('kid'); },

  openBoard(d){ go('bingo', {board:d.id}); },
  tap(d, el){
    const k = kid(), b = boardById(V.board), card = getCard(k.id, b.id), i = +d.i;
    if(card.items[i].free) return;
    card.marked[i] = !card.marked[i];
    const sc = scoreCard(card, b.size), delta = sc.pts - card.earned;
    const newLines = sc.lines > card.lines, newBlack = sc.black && !card.black;
    Object.assign(card, {earned:sc.pts, lines:sc.lines, black:sc.black});
    put(`cards/${k.id}/${b.id}`, card);
    if(delta) addPoints(k, delta, delta > 0 ? `Bingo on ${b.name}` : `Unmarked a square on ${b.name}`);
    el.classList.toggle('on', card.marked[i]);
    document.querySelectorAll('.cell').forEach((c,j) => c.classList.toggle('win', sc.win.has(j)));
    document.getElementById('cardStat').textContent = statText(card);
    document.querySelectorAll('.ptsLive').forEach(x => x.textContent = k.points);
    if(newBlack) celebrate('BLACKOUT!', `+${delta} points! You filled the whole card!`);
    else if(newLines) celebrate('BINGO!', `+${delta} points for ${k.name}!`);
  },
  newCardAsk(){
    confirmBox('New card?', 'You get a brand new card. Don’t worry, <b>your points stay!</b>', 'New card', () => {
      const k = kid(), c = newCard(boardById(V.board)); S.cards[k.id][V.board] = c; put(`cards/${k.id}/${V.board}`, c); render(); toast('Fresh card. Good luck!');
    });
  },
  closeCelebrate(){ document.getElementById('celebrate').classList.remove('show'); },

  noteFilter(d){ V.noteFilter = d.v; render(); },
  newNote(){ const n = makeNote(); go('noteEdit', {noteId:n.id}); setTimeout(() => { const t = document.getElementById('noteText'); t && t.focus(); }, 80); },
  newDrawing(){ const n = makeNote(); V.noteId = n.id; go('draw'); },
  openNote(d){ go('noteEdit', {noteId:d.id}); },
  noteSession(d){ const n = findNote(V.noteId); n.session = d.v; put(notePath(n,'session'), d.v); render(); },
  addPrompt(d){
    const t = document.getElementById('noteText'), n = findNote(V.noteId);
    n.text = (n.text && !n.text.endsWith('\n') ? n.text + '\n' : (n.text||'')) + d.v + ' ';
    t.value = n.text; put(notePath(n,'text'), n.text); t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  },
  deleteNoteAsk(){
    confirmBox('Delete this note?', 'It will be gone for good.', 'Delete', () => {
      const k = kid(), n = findNote(V.noteId); S.notes[k.id] = S.notes[k.id].filter(x => x.id !== n.id); put(notePath(n), null); go('notes');
    }, true);
  },
  penColor(d){ V.pen.color = d.v; document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s.dataset.v===d.v)); },
  penSize(d){ V.pen.size = +d.v; document.querySelectorAll('.size').forEach(s => s.classList.toggle('sel', s.dataset.v===d.v)); },
  clearCanvas(){
    const cv = V.canvas, last = cv.strokes[cv.strokes.length - 1];
    if(last && last.clear) return;
    cv.strokes.push({clear:true}); cv.redo = []; redrawCanvas(); updateUndoButtons();
  },
  undoStroke(){ const cv = V.canvas; if(!cv.strokes.length) return; cv.redo.push(cv.strokes.pop()); redrawCanvas(); updateUndoButtons(); },
  redoStroke(){ const cv = V.canvas; if(!cv.redo.length) return; cv.strokes.push(cv.redo.pop()); redrawCanvas(); updateUndoButtons(); },
  saveDrawing(){
    const n = findNote(V.noteId); n.drawing = document.getElementById('cv').toDataURL('image/jpeg', .8); put(notePath(n,'drawing'), n.drawing); go('noteEdit');
  },

  redeemAsk(d){
    const k = kid(), r = S.rewards.find(x => x.id===d.id);
    gate(() => confirmBox('Get this reward?', `<b>${esc(r.name)}</b> for ${r.cost} points.<br>${esc(k.name)} will have ${k.points - r.cost} left.`, 'Yes!', () => {
      addPoints(k, -r.cost, `Reward: ${r.name}`); render();
      celebrate('🎁 Yay!', `Enjoy: ${r.name}`);
    }));
  },

  parent(){ gate(() => go('parent')); },
  changeCode(){ setCode(() => toast('Parent code changed')); },
  adj(d){ addPoints(S.kids.find(x => x.id===d.id), +d.v, 'Parent adjustment'); render(); },
  async shareLink(d){
    const {title, url} = linkFor(d.id);
    if(navigator.share){ try{ await navigator.share({title, url}); return; }catch(e){ if(e.name === 'AbortError') return; } }
    A.copyLink(d);
  },
  async copyLink(d){
    const {title, url} = linkFor(d.id);
    try{ await navigator.clipboard.writeText(url); toast('Link copied'); return; }catch(e){}
    showModal(`<h2>${esc(title)}</h2><p>Copy this link:</p><input class="inp" style="font-size:15px" readonly value="${esc(url)}" onfocus="this.select()">
      <div class="row end" style="margin-top:12px"><button class="btn" data-act="closeModal">Done</button></div>`);
  },
  deleteKidAsk(d){
    const k = S.kids.find(x => x.id===d.id);
    confirmBox(`Remove ${esc(k.name)}?`, 'Their points, cards and notes will be deleted on every device.', 'Remove', () => {
      S.kids = S.kids.filter(x => x.id!==k.id); delete S.cards[k.id]; delete S.notes[k.id];
      patch({[`kids/${k.id}`]:null, [`cards/${k.id}`]:null, [`notes/${k.id}`]:null});
      if(S.activeKid === k.id) S.activeKid = null; render();
    }, true);
  },
  addReward(){
    const name = document.getElementById('rwName').value.trim(), cost = parseInt(document.getElementById('rwCost').value, 10);
    if(!name || !(cost > 0)){ toast('Type a reward name and a point cost.'); return; }
    const id = uid(); S.rewards.push({id, name, cost}); put(`rewards/${id}`, {name, cost}); document.activeElement.blur(); render();
  },
  deleteReward(d){ S.rewards = S.rewards.filter(r => r.id!==d.id); put(`rewards/${d.id}`, null); render(); },
  saveSettings(){
    const l = parseInt(document.getElementById('setLine').value,10), b = parseInt(document.getElementById('setBlack').value,10);
    if(!(l >= 0) || !(b >= 0)){ toast('Use whole numbers.'); return; }
    S.settings = {linePts:l, blackoutPts:b}; put('settings', S.settings); document.activeElement.blur(); toast('Saved'); render();
  },
  resetCardsAsk(){ confirmBox('New cards for everyone?', 'All bingo cards start over. Points are kept.', 'Reset cards', () => { S.cards = {}; put('cards', null); render(); toast('All cards reset'); }); },
  resetPointsAsk(){ confirmBox('Reset all points to 0?', 'This can’t be undone.', 'Reset points', () => {
    const upd = {};
    S.kids.forEach(k => { if(k.points){ upd[`history/${push(famRef('history')).key}`] = {kidId:k.id, delta:-k.points, reason:'Points reset', ts:Date.now()}; } upd[`kids/${k.id}/points`] = 0; k.points = 0; });
    patch(upd); render();
  }, true); },
  eraseAllAsk(){ confirmBox('Erase the whole family?', 'Kids, points, cards, notes and rewards will be deleted on <b>every device</b>, and the links will stop working.', 'Erase', async () => {
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
    await set(famRef(), null).catch(dbErr);
    A.forgetFamily();
  }, true); },

  closeModal,
  modalYes(){ const cb = V.modalCb; closeModal(); cb && cb(); },
  gateCheck(){
    const v = document.getElementById('gateIn').value;
    if(hashCode(v) === S.parentCode){ const cb = V.gateCb; closeModal(); cb && cb(); }
    else { document.getElementById('gateErr').textContent = 'That’s not the code.'; document.getElementById('gateIn').select(); }
  },
  async saveCode(){
    const a = document.getElementById('codeA').value, b = document.getElementById('codeB').value, err = document.getElementById('codeErr');
    if(a.length < 4){ err.textContent = 'Use at least 4 characters.'; return; }
    if(a !== b){ err.textContent = 'The two codes don’t match.'; return; }
    const cb = V.setCodeCb;
    if(!FID){
      err.textContent = 'Creating your family…';
      try{ await createFamily(hashCode(a)); }catch(e){ console.error(e); FID = null; err.textContent = 'Could not reach the database. Check the internet and try again.'; return; }
      S.parentCode = hashCode(a);
    } else { S.parentCode = hashCode(a); put('parentCode', S.parentCode); }
    closeModal(); cb && cb();
  }
};
function makeNote(){
  const k = kid(); S.notes[k.id] = S.notes[k.id] || [];
  const n = {id:uid(), session: V.noteFilter && V.noteFilter!=='all' ? V.noteFilter : guessSession(), text:'', ts:Date.now()};
  S.notes[k.id].push(n); put(notePath(n), {session:n.session, text:'', ts:n.ts}); return n;
}

/* ============ Events ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  if(el.id === 'modal') return;
  const fn = A[el.dataset.act]; if(fn) fn(el.dataset, el);
});
document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if(!b) return;
  if(b === 'name') V.draft.name = e.target.value;
  if(b === 'noteText'){
    const n = findNote(V.noteId); if(!n) return;
    n.text = e.target.value; clearTimeout(textT); textT = setTimeout(() => put(notePath(n,'text'), n.text), 400);
  }
});
document.addEventListener('focusout', () => setTimeout(() => {
  const a = document.activeElement;
  if(pendingRender && !(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) && !['noteEdit','draw','editKid'].includes(V.view)) softRender();
}, 50));
document.addEventListener('keydown', e => {
  if(V.view === 'draw' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? A.redoStroke() : A.undoStroke(); return; }
  if(e.key !== 'Enter' || !document.getElementById('modal').classList.contains('show')) return;
  const id = document.activeElement && document.activeElement.id;
  if(id === 'gateIn') A.gateCheck();
  else if(id === 'codeA') document.getElementById('codeB').focus();
  else if(id === 'codeB') A.saveCode();
});
// tidy: drop empty notes when leaving the editor
const _go = go;
go = function(view, extra){
  if((V.view === 'noteEdit' || V.view === 'draw') && view === 'notes'){
    const k = kid(), n = findNote(V.noteId);
    if(k && n){
      clearTimeout(textT);
      if(!n.text.trim() && !n.drawing){ S.notes[k.id] = S.notes[k.id].filter(x => x.id !== n.id); put(notePath(n), null); }
      else put(notePath(n,'text'), n.text);
    }
  }
  _go(view, extra);
};

// Small "offline" pill so a parent knows changes will sync later.
let offlineT;
onValue(ref(db, '.info/connected'), s => {
  const el = document.getElementById('offline');
  clearTimeout(offlineT);
  if(s.val()) el.classList.remove('show');
  else offlineT = setTimeout(() => el.classList.add('show'), 4000);
});

window.__ck = {S, V, A, get FID(){ return FID; }, go};
render(true);
if(FID) connect();
</script>
